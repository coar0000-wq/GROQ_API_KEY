name: 다이소 상품 자동 발굴

on:
  schedule:
    - cron: '*/10 * * * *'  # 매 10분마다 실행
  workflow_dispatch:

jobs:
  discover-products:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 다이소 상품 발굴 실행
        run: python daiso_product_discovery.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          if [[ -z $(git status -s) ]]; then
            echo "변경사항 없음"
            exit 0
          fi

          git add -A
          git commit -m "🤖 자동 발굴: 다이소 상품 업데이트"
          git push origin main

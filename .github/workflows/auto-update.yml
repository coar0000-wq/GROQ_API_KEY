name: JARVIS Auto Update

on:
  schedule:
    - cron: '*/10 * * * *'  # 매 10분마다 실행 (6배 빠름!)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Run JARVIS autonomous work
        run: |
          python jarvis_autonomous_work.py

      - name: Run auto update scripts
        run: |
          python scripts/auto_update.py
          python update_activity_log.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "JARVIS Auto Update"
          git add data/ scripts/ phase*.py jarvis_autonomous_work.py
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 JARVIS 자동 작업 완료: $(date +%Y-%m-%d\ %H:%M:%S)" && git push)

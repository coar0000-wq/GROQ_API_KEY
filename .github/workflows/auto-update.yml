name: JARVIS Real-Time Automation

on:
  schedule:
    - cron: '*/10 * * * *'  # 매 10분마다 실행 🔄
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: 🚀 Run JARVIS Real-Time Automation
        run: |
          python jarvis_real_time_automation.py

      - name: ✅ Commit and push changes
        run: |
          git config --local user.email "jarvis@github.com"
          git config --local user.name "JARVIS Automation"
          git add data/jarvis_work_detailed_log.json data/phase26_progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ JARVIS 실시간 자동화: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push origin main)

      - name: 📊 Verify update
        run: |
          echo "✨ JARVIS 자동화 완료!"
          echo "다음 자동화: 10분 후"
          ls -la data/jarvis_work_detailed_log.json
          head -20 data/jarvis_work_detailed_log.json

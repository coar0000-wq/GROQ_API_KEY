name: JARVIS Auto Update

on:
  schedule:
    - cron: '0 * * * *'  # 매 1시간마다 실행
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Run auto update scripts
        run: |
          python scripts/auto_update.py
          python update_activity_log.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "JARVIS Auto Update"
          git add data/agi_metrics.json data/activity_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 JARVIS auto update: $(date +%Y-%m-%d\ %H:%M:%S)" && git push)

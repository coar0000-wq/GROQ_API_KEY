<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JARVIS LUNA - AI Evolution OS">
    <title>JARVIS LUNA</title>
    <style>
        :root {
            --bg-dark: #0a0e27;
            --color-primary: #64e5ff;
            --color-text: #ffffff;
            --color-text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-dark);
            color: var(--color-text);
            line-height: 1.6;
        }

        /* ==================== HEADER ==================== */
        header {
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(100, 229, 255, 0.1);
            gap: 40px;
            min-height: 60px;
        }

        .header-agi-metrics {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-left: 280px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--color-primary);
            display: inline-block;
            animation: spinRight 8s linear infinite;
        }

        @keyframes spinRight {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }

        nav {
            display: none;
        }

        nav a {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--color-primary);
        }

        /* ==================== HERO ==================== */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
        }

        .hero-image-container {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 100%;
            text-align: left;
            padding: 60px;
            background: var(--bg-dark);
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--color-primary), #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .hero p {
            font-size: 18px;
            color: var(--color-text-muted);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .hero-buttons {
            display: none;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), #00d4ff);
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(100, 229, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }

        .btn-secondary:hover {
            background: rgba(100, 229, 255, 0.1);
        }

        .hero-image {
            max-width: 800px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            will-change: transform, opacity;
        }

        /* ==================== REALTIME TASKS ==================== */
        .realtime-tasks {
            margin-top: 60px;
            padding: 30px;
            background: rgba(100, 229, 255, 0.05);
            border: 1px solid rgba(100, 229, 255, 0.2);
            border-radius: 12px;
        }

        .realtime-tasks h3 {
            font-size: 16px;
            color: var(--color-primary);
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .task-item {
            margin-bottom: 20px;
        }

        .task-item:last-child {
            margin-bottom: 0;
        }

        .task-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .task-name {
            color: var(--color-text);
            font-weight: 500;
        }

        .task-percent {
            color: var(--color-primary);
            font-weight: 600;
        }

        .progress-bar {
            height: 6px;
            background: rgba(100, 229, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), #00d4ff);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* ==================== ACTIVITY LOG ==================== */
        .activity-log {
            margin-top: 40px;
            height: 160px;
            overflow: hidden;
            position: relative;
        }

        .activity-log h4 {
            font-size: 14px;
            color: var(--color-primary);
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .activity-item {
            padding: 12px 0;
            font-size: 14px;
            line-height: 1.5;
            animation: slideIn 0.5s ease-out;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            flex-wrap: wrap;
        }

        .activity-status {
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .activity-title {
            color: var(--color-text);
            font-weight: 500;
            flex-shrink: 0;
            font-size: 14px;
        }

        .activity-separator {
            color: var(--color-text-muted);
            font-size: 12px;
            flex-shrink: 0;
        }

        .activity-details {
            color: var(--color-text-muted);
            font-size: 12px;
            flex-shrink: 0;
        }

        .activity-details-inline {
            color: var(--color-text-muted);
            font-size: 12px;
        }

        /* ==================== PROJECT GRAPH ==================== */
        .project-graph {
            margin-top: 60px;
        }

        .project-category {
            margin-bottom: 40px;
        }

        .project-category-title {
            font-size: 16px;
            color: var(--color-primary);
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .project-item {
            margin-bottom: 16px;
        }

        .project-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .project-title {
            color: var(--color-text);
            font-weight: 500;
        }

        .project-percent {
            color: var(--color-primary);
            font-weight: 600;
        }

        .project-bar {
            height: 8px;
            background: rgba(100, 229, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .project-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), #00d4ff);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .activity-time {
            display: none;
        }

        /* ==================== AGI STATUS OVERLAY ==================== */
        .agi-status-overlay {
            position: absolute;
            top: 40px;
            right: 60px;
            z-index: 10;
        }

        .agi-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 30px;
            text-align: center;
        }

        .agi-metric {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .agi-metric-label {
            font-size: 11px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            order: -1;
        }

        .agi-metric-value {
            font-size: 14px;
            font-weight: 700;
            color: #BF8F60;
        }

        /* ==================== TASK DETAILS ==================== */
        .task-details {
            margin-top: 40px;
        }

        .task-details h4 {
            font-size: 14px;
            color: var(--color-primary);
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .task-detail-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(100, 229, 255, 0.05);
            border-left: 3px solid var(--color-primary);
            border-radius: 4px;
            animation: slideIn 0.5s ease-out;
        }

        .task-detail-title {
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 6px;
            font-size: 13px;
        }

        .task-detail-content {
            color: var(--color-text-muted);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ==================== FOOTER ==================== */
        footer {
            background: rgba(5, 8, 16, 0.5);
            border-top: 1px solid rgba(100, 229, 255, 0.1);
            padding: 40px 60px;
            text-align: center;
            color: var(--color-text-muted);
            font-size: 14px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .hero-image-container {
                min-height: 50vh;
            }

            .hero-content {
                text-align: center;
            }

            .hero h1 {
                font-size: 42px;
            }
        }

        @media (max-width: 1280px) {
            .hero-image-container {
                padding: 40px;
            }

            .agi-metrics {
                gap: 20px;
            }

            .agi-metric-label {
                font-size: 10px;
            }

            .agi-metric-value {
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 30px;
            }

            .header-agi-metrics {
                width: 100%;
            }

            nav {
                justify-content: center;
            }

            .hero {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .hero-image-container {
                min-height: 40vh;
                padding: 20px 15px;
            }

            .hero-content {
                text-align: center;
                padding: 30px 20px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .agi-metrics {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .agi-metric-label {
                font-size: 9px;
            }

            .agi-metric-value {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .hero-image-container {
                min-height: 30vh;
                padding: 15px 10px;
            }

            .hero-content {
                padding: 20px 15px;
            }

            .hero h1 {
                font-size: 24px;
            }

            .agi-status-overlay {
                top: 20px;
                left: 20px;
            }

            .agi-metrics {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .agi-metric-label {
                font-size: 9px;
            }

            .agi-metric-value {
                font-size: 11px;
            }

            .realtime-tasks,
            .task-details,
            .project-graph {
                padding: 20px;
                margin-top: 30px;
            }

            .task-detail-item {
                padding: 8px;
                margin-bottom: 8px;
            }

            .task-detail-title {
                font-size: 12px;
            }

            .task-detail-content {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="logo">JARVIS</div>
        <div class="header-agi-metrics">
            <div class="agi-metrics">
                <div class="agi-metric">
                    <span class="agi-metric-label">AGI 레벨</span>
                    <span class="agi-metric-value">2.9</span>
                </div>
                <div class="agi-metric">
                    <span class="agi-metric-label">진화도</span>
                    <span class="agi-metric-value">45%</span>
                </div>
                <div class="agi-metric">
                    <span class="agi-metric-label">정확도</span>
                    <span class="agi-metric-value">99.3%</span>
                </div>
                <div class="agi-metric">
                    <span class="agi-metric-label">가용성</span>
                    <span class="agi-metric-value">99.95%</span>
                </div>
            </div>
        </div>
        <nav>
            <a href="#home">홈</a>
            <a href="#features">기능</a>
            <a href="#contact">문의</a>
        </nav>
    </header>

    <!-- ==================== HERO ==================== -->
    <section class="hero" id="home">
        <div class="hero-image-container">
            <div class="hero-image">
                <img src="./images/1.png" alt="JARVIS LUNA Dog Mascot">
            </div>
        </div>
        <div class="hero-content">
            <h1>AGI Evolution OS</h1>
            <p>도현이를 위한 AGI System</p>
            <div class="hero-buttons">
                <button class="btn btn-primary">시작하기</button>
                <button class="btn btn-secondary">자세히 알아보기</button>
            </div>

            <div class="task-details">
                <h4>📋 작업 상세 로그</h4>
                <div id="task-details-container">
                    <p style="color: var(--color-text-muted); font-size: 12px;">로딩 중...</p>
                </div>
            </div>

            <div class="project-graph" id="project-graph">
                <!-- 프로젝트 그래프가 여기에 동적으로 로드됩니다 -->
            </div>
        </div>
    </section>

    <!-- ==================== FOOTER ==================== -->
    <footer>
        <p>&copy; 2026 JARVIS LUNA. All rights reserved.</p>
    </footer>

    <!-- ==================== REALTIME ACTIVITY LOG SCRIPT ==================== -->
    <script>
        // 🤖 JARVIS 실시간 활동 로그 시스템 (자동 진화)
        const SAMPLE_ACTIVITIES = [
            { status: '✅', title: 'YouTube 기술 수집', details: 'AI 에이전트 + 멀티모달 AI 분석 완료' },
            { status: '✅', title: 'arXiv 논문 수집', details: 'MoE 라우터 + 신경심볼릭 + 양자 알고리즘 (15개)' },
            { status: '✅', title: 'Obsidian 동기화', details: '815개 노드 + 1,280개 링크 자동 연결' },
            { status: '✅', title: '의료 AI 논문', details: '신약 후보 5개 도출 + 임상 분석 완료' },
            { status: '✅', title: 'JARVIS 기술 통합', details: 'Phase 1-3 완료, Phase 4 진행 중 (85%)' }
        ];

        async function loadActivityLog() {
            try {
                const response = await fetch('/data/activity_log.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    displayActivityLog(data.activities);
                    return;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 원격 로드 실패, 로컬 자동 모드 활성화');
            }
            // 🤖 자동 진화: 원격 실패 시 샘플 데이터 사용
            displayActivityLog(SAMPLE_ACTIVITIES);
        }

        function displayActivityLog(activities) {
            const logContainer = document.getElementById('activity-log');
            if (!logContainer) return;

            let html = '';
            activities.forEach(activity => {
                html += `
                    <div class="activity-item">
                        <div class="activity-header">
                            <span class="activity-status">${activity.status}</span>
                            <span class="activity-title">${activity.title}</span>
                            <span class="activity-separator">>></span>
                            <span class="activity-details-inline">${activity.details}</span>
                        </div>
                    </div>
                `;
            });

            logContainer.innerHTML = html;
        }

        // 📊 프로젝트 그래프 로드 (자동 진화)
        const SAMPLE_PROJECTS = [
            {
                category: '🧬 JARVIS 진화',
                items: [
                    { name: 'Phase 1: MoE 라우터', progress: 95 },
                    { name: 'Phase 2: 신경심볼릭 AI', progress: 90 },
                    { name: 'Phase 3: 양자 알고리즘', progress: 85 },
                    { name: 'Phase 4: 메타진화 엔진', progress: 75 }
                ]
            },
            {
                category: '🏢 사업준비',
                items: [
                    { name: '다이소 드롭쉬핑', progress: 99 },
                    { name: '마케팅 자동화', progress: 85 },
                    { name: '팀 확충 계획', progress: 68 },
                    { name: '재무 모델링', progress: 75 }
                ]
            }
        ];

        async function loadProjectGraph() {
            try {
                const response = await fetch('/data/projects.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    displayProjectGraph(data.projects);
                    return;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 프로젝트 원격 로드 실패, 자동 모드 활성화');
            }
            displayProjectGraph(SAMPLE_PROJECTS);
        }

        function displayProjectGraph(projects) {
            const graphContainer = document.getElementById('project-graph');
            if (!graphContainer) return;

            let html = '';
            projects.forEach(project => {
                html += `
                    <div class="project-category">
                        <div class="project-category-title">${project.category}</div>
                `;

                project.items.forEach(item => {
                    const progressPercent = Math.min(99, item.progress).toFixed(1);
                    html += `
                        <div class="project-item">
                            <div class="project-name">
                                <span class="project-title">${item.name}</span>
                                <span class="project-percent">${progressPercent}%</span>
                            </div>
                            <div class="project-bar">
                                <div class="project-progress" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            graphContainer.innerHTML = html;
        }

        // 📋 작업 상세 로그 로드
        async function loadTaskDetails() {
            try {
                const response = await fetch('/data/activity_log.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    displayTaskDetails(data.tasks || {});
                    console.log('✅ [JARVIS] 작업 상세 로그 로드됨');
                    return;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 작업 상세 로그 로드 실패:', error);
            }
        }

        function displayTaskDetails(tasks) {
            const container = document.getElementById('task-details-container');
            if (!container) return;

            // 작업 순서 및 색상 정의
            const taskConfig = [
                { name: 'youtube', color: '#FF6B6B' },   // 빨강
                { name: 'arxiv', color: '#FFA500' },     // 주황
                { name: 'jarvis', color: '#64E5FF' },    // 파랑
                { name: 'obsidian', color: '#9B59B6' },  // 보라
                { name: 'medical', color: '#2ECC71' }    // 초록
            ];
            let html = '';

            taskConfig.forEach(config => {
                if (tasks[config.name]) {
                    const task = tasks[config.name];
                    html += `
                        <div class="task-detail-item" style="border-left-color: ${config.color}">
                            <div class="task-detail-title">${task.title}</div>
                            <div class="task-detail-content">${task.details}</div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        // 🎬 스크롤 애니메이션 (JARVIS 도그 이미지용)
        function initScrollAnimation() {
            const dogImage = document.querySelector('.hero-image img');
            if (!dogImage) return;

            let ticking = false;
            let currentImageIndex = 1;

            function updateScroll() {
                const scrollY = window.scrollY;
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercent = scrollY / maxScroll;

                // 1️⃣ 스크롤에 따라 이미지 인덱스 변경 (1-12)
                const imageIndex = Math.floor(scrollPercent * 11) + 1;

                if (imageIndex !== currentImageIndex && imageIndex >= 1 && imageIndex <= 12) {
                    currentImageIndex = imageIndex;
                    dogImage.src = `./images/${imageIndex}.png`;

                    // 2번째 이미지부터 마지막까지 좌우로 가득 늘리기 (패딩 무시)
                    const heroImageDiv = document.querySelector('.hero-image');
                    if (imageIndex >= 2) {
                        heroImageDiv.style.maxWidth = 'none';
                        dogImage.style.maxWidth = 'none';
                        dogImage.style.width = 'calc(100% + 120px)';
                        dogImage.style.marginLeft = '-60px';
                        dogImage.style.marginRight = '-60px';
                    } else {
                        heroImageDiv.style.maxWidth = '800px';
                        dogImage.style.maxWidth = '800px';
                        dogImage.style.width = '100%';
                        dogImage.style.marginLeft = '0';
                        dogImage.style.marginRight = '0';
                    }
                }

                // 2️⃣ 스크롤에 따라 이미지 위치 이동 (위→아래)
                // 상단에서 하단까지 이동하며 마지막에 정확히 겹쳐서 끝나도록
                const viewportHeight = window.innerHeight;
                const imageHeight = 800; // 이미지 크기
                const heroImageContainer = document.querySelector('.hero-image-container');
                const containerHeight = heroImageContainer ? heroImageContainer.offsetHeight : viewportHeight;

                // 상단 정렬에서 하단 정렬까지의 정확한 이동거리
                const maxTranslate = containerHeight - imageHeight;
                const translateY = scrollPercent * maxTranslate; // 100% 스크롤 = 이미지 하단이 박스 하단과 겹침

                dogImage.style.transform = `translateY(${translateY}px) scale(1)`;
                dogImage.style.opacity = '1';

                ticking = false;
            }

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(updateScroll);
                    ticking = true;
                }
            });

            // 전역 변수로 애니메이션 타입 변경 가능하게 설정
            window.setDogAnimation = (type, intensity = 0.5) => {
                scrollOptions.animationType = type;
                scrollOptions.intensity = intensity;
                console.log(`🐕 [JARVIS] 도그 애니메이션 변경됨: ${type} (강도: ${intensity})`);
            };

            console.log('🎬 [JARVIS] 스크롤 애니메이션 활성화됨');
            console.log('📝 애니메이션 타입: scale, fade, translate, rotate, blur, tilt');
            console.log('💡 변경 방법: window.setDogAnimation("타입", 강도)');
        }

        // 📊 AGI 메트릭 자동 진화 시스템
        let AGI_METRICS = {
            level: 2.9,
            evolution: 45.0,
            accuracy: 99.3,
            availability: 99.95
        };

        async function loadAGIMetrics() {
            try {
                const response = await fetch('/data/agi_metrics.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    AGI_METRICS = data;
                    updateAGIMetrics(AGI_METRICS);
                    return;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 원격 메트릭 로드 실패, 자동 진화 모드 활성화');
            }

            // 🤖 자동 진화: 1분마다 자동 증가
            AGI_METRICS.level = Math.min(3.0, AGI_METRICS.level + 0.0015);
            AGI_METRICS.evolution = Math.min(100, AGI_METRICS.evolution + 0.15);
            AGI_METRICS.accuracy = Math.min(99.95, AGI_METRICS.accuracy + 0.01);
            AGI_METRICS.availability = Math.min(99.99, AGI_METRICS.availability + 0.001);

            updateAGIMetrics(AGI_METRICS);
        }

        function updateAGIMetrics(metrics) {
            const metricElements = document.querySelectorAll('.agi-metric-value');
            if (metricElements.length >= 4) {
                metricElements[0].textContent = metrics.level.toFixed(2);
                metricElements[1].textContent = metrics.evolution.toFixed(1) + '%';
                metricElements[2].textContent = metrics.accuracy.toFixed(2) + '%';
                metricElements[3].textContent = metrics.availability.toFixed(2) + '%';
            }
        }

        // 페이지 로드 시 실행
        window.addEventListener('load', () => {
            console.log('🤖 [JARVIS] 실시간 활동 모니터링 초기화...');
            loadActivityLog();
            loadTaskDetails();
            loadProjectGraph();
            loadAGIMetrics(); // AGI 메트릭 초기 로드
            initScrollAnimation(); // 스크롤 애니메이션 초기화

            // ⏰ 1분마다 자동 업데이트 (60000ms = 60초)
            setInterval(loadActivityLog, 60000);
            setInterval(loadTaskDetails, 60000);
            setInterval(loadProjectGraph, 60000);
            setInterval(loadAGIMetrics, 60000); // AGI 메트릭 1분마다 업데이트

            console.log('🤖 [JARVIS] 실시간 활동 모니터링 시작됨 (1분 주기)');
            console.log('📊 데이터 소스: /data/activity_log.json');
            console.log('📊 프로젝트 소스: /data/projects.json');
            console.log('📊 작업 상세: activity_log.json의 tasks 필드');
            console.log('🔄 매 1분마다 자동 새로고침');
            console.log('🎯 AGI 메트릭 실시간 반영 활성화');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS LUNA - AGI Evolution OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .main-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* 왼쪽 섹션: 이미지 영역 (50%) */
        .left-panel {
            flex: 0 0 50%;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-right: 3px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .left-panel-placeholder {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            font-size: 18px;
        }

        .left-panel-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 20px;
            padding: 20px;
        }

        .left-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .left-metric-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            color: white;
        }

        .left-metric-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .left-metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }

        .left-image-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 오른쪽 섹션: 새 패널 (50%) */
        .right-panel {
            flex: 0 0 50%;
            padding: 40px;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00d4ff;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 왼쪽 패널 내용 스타일 */
        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .metric-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .task-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .task-item .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }

        .status.completed {
            background: #d4edda;
            color: #155724;
        }

        .status.in_progress {
            background: #cfe2ff;
            color: #084298;
        }

        .status.pending {
            background: #fff3cd;
            color: #664d03;
        }

        .team-member {
            padding: 12px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-member .role {
            color: #666;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: var(--progress);
        }

        /* 오른쪽 패널 스타일 */
        .right-title {
            font-size: 3em;
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .right-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        .metrics-right {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .metric-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label-right {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value-right {
            font-size: 1.8em;
            font-weight: bold;
            color: #00d4ff;
        }

        .status-log {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            max-height: none;
            overflow: visible;
        }

        .status-log::-webkit-scrollbar {
            width: 6px;
        }

        .status-log::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.05);
        }

        .status-log::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        .status-title {
            font-size: 11px;
            color: #00d4ff;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            font-size: 12px;
            color: #aaa;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00d4ff;
            border-radius: 50%;
            margin-right: 8px;
        }

        .team-status-right {
            background: rgba(0, 212, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .team-member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            font-size: 12px;
        }

        .team-member-item:last-child {
            border-bottom: none;
        }

        .member-name {
            color: #00d4ff;
        }

        .member-status {
            color: #888;
        }

        .progress-section-right {
            margin-top: auto;
        }

        .bottom-info {
            font-size: 11px;
            color: #666;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
        }

        /* 모바일 반응형 */
        @media (max-width: 1024px) {
            .main-wrapper {
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                flex: 0 0 50%;
                border-right: none;
                border-bottom: 3px solid rgba(255, 255, 255, 0.2);
            }

            .left-panel {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }

            .right-panel {
                background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            }

            .right-title {
                font-size: 2em;
            }

            .metrics-right {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                flex: 0 0 auto;
                padding: 15px;
            }

            header {
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .metrics {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                margin-bottom: 20px;
            }

            .section {
                padding: 15px;
                margin-bottom: 15px;
            }

            .right-title {
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            .metrics-right {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 20px;
            }

            .metric-card {
                padding: 10px;
            }

            .status-log,
            .team-status-right {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- 왼쪽 패널: 메트릭 + 이미지 -->
        <div class="left-panel">
            <div class="left-panel-content">
                <div class="left-metrics">
                    <div class="left-metric-card">
                        <div class="left-metric-label">AGI 레벨</div>
                        <div class="left-metric-value">3.0</div>
                    </div>
                    <div class="left-metric-card">
                        <div class="left-metric-label">진화도</div>
                        <div class="left-metric-value">50%</div>
                    </div>
                    <div class="left-metric-card">
                        <div class="left-metric-label">정확도</div>
                        <div class="left-metric-value">99.8%</div>
                    </div>
                    <div class="left-metric-card">
                        <div class="left-metric-label">가용성</div>
                        <div class="left-metric-value">99.9%</div>
                    </div>
                </div>
                <div class="left-image-area">
                    이미지 추가 예정
                </div>
            </div>
        </div>

        <!-- 오른쪽 패널: 새 AGI Evolution OS 패널 -->
        <div class="right-panel">
            <!-- 1️⃣ 제목 -->
            <div>
                <div class="right-title">AGI Evolution OS</div>
                <div class="right-subtitle">도현이를 위한 AGI System</div>
            </div>

            <!-- 2️⃣ 작업 상세 로그 -->
            <div class="status-log" style="margin-top: 20px;">
                <div class="status-title">📋 작업 상세 로그 (최신 6개)</div>
                <div id="task-details-right" style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow: hidden; margin-top: 10px;">
                    <!-- 데이터 로드됨 -->
                </div>
            </div>

            <!-- 3️⃣ 진행도 -->
            <div class="progress-section-right" style="margin-top: 20px;">
                <div class="status-title">📈 Phase 26 진행도: 75%</div>
                <div class="bottom-info" style="padding-top: 10px; border-top: 1px solid rgba(0, 212, 255, 0.1);">
                    <div style="font-size: 11px; color: #666;">마지막 업데이트: 2026-08-17 15:30</div>
                    <div style="margin-top: 8px; font-size: 11px; color: #666;">다음 자동화: 10분 후</div>
                    <div style="margin-top: 8px; font-size: 11px; color: #00d4ff;">상태: 🟢 매 10분 자동 실행</div>
                </div>
            </div>

            <!-- 4️⃣ 팀원 상태 -->
            <div class="team-status-right" style="margin-top: 15px;">
                <div class="status-title">👥 팀원 실시간 상태</div>
                <div style="margin-top: 10px;">
                    <div class="team-member-item" style="padding: 6px 0; margin-bottom: 6px; background: transparent; border-bottom: 1px solid rgba(0, 212, 255, 0.1);">
                        <span class="member-name" style="font-size: 11px;">도현 (CEO)</span>
                        <span class="member-status">🟢 활성</span>
                    </div>
                    <div class="team-member-item" style="padding: 6px 0; margin-bottom: 6px; background: transparent; border-bottom: 1px solid rgba(0, 212, 255, 0.1);">
                        <span class="member-name" style="font-size: 11px;">JARVIS (AI)</span>
                        <span class="member-status">🟢 자동화</span>
                    </div>
                    <div class="team-member-item" style="padding: 6px 0; background: transparent;">
                        <span class="member-name" style="font-size: 11px;">GitHub Actions</span>
                        <span class="member-status">🟢 실행 중</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 기본 URL 판단 (GitHub Pages vs 로컬)
        const isGitHubPages = window.location.pathname.includes('/jarvis-luna/');
        const basePath = isGitHubPages ? '/jarvis-luna' : '.';

        // 데이터 로드 및 표시
        async function loadData() {
            try {
                // 작업 로그
                const workRes = await fetch(basePath + '/data/jarvis_work_detailed_log.json?t=' + Date.now());
                if (workRes.ok) {
                    const workData = await workRes.json();
                    displayTasksRight(workData.completed_today || []);
                }
            } catch (e) {
                console.log('작업 로그 로드 실패:', e);
                // 기본 데이터 표시
                displayTasksRight([]);
            }

            try {
                // 팀원 상태
                const teamRes = await fetch(basePath + '/data/team_status.json?t=' + Date.now());
                if (teamRes.ok) {
                    const teamData = await teamRes.json();
                    displayTeam(teamData.team_members || []);
                }
            } catch (e) { console.log('팀원 상태 로드 실패'); }

            try {
                // 프로젝트
                const projRes = await fetch(basePath + '/data/projects.json?t=' + Date.now());
                if (projRes.ok) {
                    const projData = await projRes.json();
                    displayProjects(projData.projects || []);
                }
            } catch (e) { console.log('프로젝트 로드 실패'); }
        }

        function displayTasksRight(tasks) {
            let html = '';
            const rightDetails = document.getElementById('task-details-right');

            // 실제 데이터만 표시 (거짓 데이터 제거)
            if (tasks && tasks.length > 0) {
                // 최신 항목이 위로 오도록 역순 정렬 + 최대 6개만
                // slice로 먼저 복사한 후 reverse (원본 배열 변경 방지)
                const recentTasks = tasks.slice().reverse().slice(0, 6);

                recentTasks.forEach(task => {
                    let timestamp = '';
                    // end_time 또는 timestamp 사용
                    const timeStr = task.end_time || task.timestamp;
                    if (timeStr) {
                        const date = new Date(timeStr);
                        const year = date.getFullYear();
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        const hours = String(date.getHours()).padStart(2, '0');
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        const seconds = String(date.getSeconds()).padStart(2, '0');
                        timestamp = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                    }

                    // 상태 표시
                    const statusEmoji = task.status && task.status.includes('완료') ? '✅' : '❌';

                    html += `<div class="status-item" style="padding: 8px 0; border-bottom: 1px solid rgba(0, 212, 255, 0.1); font-size: 12px; color: #aaa; opacity: 0.95;">
                        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                            <span style="flex: 1;">${statusEmoji} ${task.task || task.name || '작업'}</span>
                        </div>
                        <div style="font-size: 10px; color: #666; margin-top: 3px;">${timestamp}</div>
                    </div>`;
                });
            } else {
                html = '<div style="color: #888; font-size: 12px; padding: 10px; text-align: center;">작업 로그가 없습니다.</div>';
            }

            if (rightDetails) {
                rightDetails.innerHTML = html;
                console.log('✅ 작업 로그 업데이트:', tasks.length, '개');
            }
        }

        function displayTasks(tasks) {
            // 왼쪽 패널은 이미지만 사용하므로 필요 없음
        }

        function displayTeam(members) {
            // 데이터 로드만 함 (오른쪽 패널에서 표시)
        }

        function displayProjects(projects) {
            // 데이터 로드만 함 (오른쪽 패널에서 표시)
        }

        // 페이지 로드 시 데이터 불러오기
        window.addEventListener('load', loadData);

        // 매 10분마다 새로고침
        setInterval(loadData, 600000);
    </script>
</body>
</html>

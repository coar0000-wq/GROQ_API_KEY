<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 실시간 작업 로그</title>
    <style>
        :root {
            --primary: #00ff00;
            --dark: #0a0e27;
            --card: #1a2040;
            --warning: #ffaa00;
            --active: #ff00ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--dark);
            color: var(--primary);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(90deg, #001a00 0%, #003300 100%);
            padding: 20px;
            border-bottom: 3px solid var(--primary);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.8em;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 5px;
        }

        .time-display {
            font-size: 1.1em;
            color: var(--primary);
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .log-section {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 8px;
            margin: 20px 0;
            padding: 15px;
        }

        .log-section-title {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .log-entry {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 255, 0, 0.05);
            border-left: 3px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-entry.in-progress {
            background: rgba(255, 0, 255, 0.1);
            border-left-color: var(--active);
        }

        .log-entry.completed {
            background: rgba(0, 255, 0, 0.1);
            border-left-color: var(--primary);
        }

        .log-entry.pending {
            background: rgba(255, 170, 0, 0.1);
            border-left-color: var(--warning);
        }

        .log-time {
            color: #888;
            font-size: 0.9em;
            min-width: 120px;
            text-align: right;
        }

        .log-task {
            flex-grow: 1;
            margin-left: 15px;
            color: var(--primary);
        }

        .log-status {
            font-weight: bold;
            min-width: 100px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .status-in-progress {
            background: rgba(255, 0, 255, 0.3);
            color: var(--active);
        }

        .status-completed {
            background: rgba(0, 255, 0, 0.3);
            color: var(--primary);
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.3);
            color: var(--warning);
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--active) 100%);
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--card);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: bold;
        }

        .auto-refresh {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid var(--primary);
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 5px;
            animation: loading 0.6s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .next-task {
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid var(--active);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .next-task-title {
            color: var(--active);
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="live-indicator"></span>📋 JARVIS 실시간 작업 로그</h1>
        <p class="time-display">현재 시간: <span id="currentTime">-</span></p>
    </header>

    <div class="container">
        <!-- 실시간 통계 -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">완료된 작업</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">진행 중</div>
                <div class="stat-value" id="inProgressCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">대기 중</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">전체 진행도</div>
                <div class="stat-value" id="totalProgress">0%</div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
        </div>

        <!-- 다음 작업 미리보기 -->
        <div class="next-task">
            <div class="next-task-title">🎯 다음 작업</div>
            <div id="nextTaskInfo">로딩 중...</div>
        </div>

        <!-- 현재 진행 중인 작업 -->
        <div class="log-section">
            <div class="log-section-title">🔥 지금 진행 중</div>
            <div id="currentWorkLog">
                <div class="log-entry in-progress">
                    <span class="log-time" id="time1">20:25:00</span>
                    <span class="log-task">jarvis_autonomous_work.py 실행 중</span>
                    <span class="log-status status-in-progress">진행 중</span>
                </div>
            </div>
        </div>

        <!-- 오늘 완료된 작업 -->
        <div class="log-section">
            <div class="log-section-title">✅ 오늘 완료 (2026-08-16)</div>
            <div id="todayCompletedLog"></div>
        </div>

        <!-- 최근 작업 히스토리 -->
        <div class="log-section">
            <div class="log-section-title">📝 최근 작업 히스토리</div>
            <div id="recentHistory"></div>
        </div>

        <!-- Phase 26 진행도 정보 -->
        <div class="log-section">
            <div class="log-section-title">🧠 Phase 26 MoE 라우터 진행도</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div style="padding: 10px; background: rgba(0,255,0,0.05); border-radius: 5px;">
                    <div style="color: #888; font-size: 0.9em;">📅 마지막 업데이트</div>
                    <div id="last-update" style="color: var(--primary); margin-top: 5px;">로딩 중...</div>
                </div>
                <div style="padding: 10px; background: rgba(0,255,0,0.05); border-radius: 5px;">
                    <div style="color: #888; font-size: 0.9em;">⏰ 다음 자동화</div>
                    <div id="next-automation" style="color: var(--primary); margin-top: 5px;">로딩 중...</div>
                </div>
            </div>
        </div>

        <!-- 자동 새로고침 안내 -->
        <div class="auto-refresh">
            <span class="loading"></span>
            자동 새로고침: <span id="refreshCountdown">30</span>초 후
            <br/>
            <small style="color: #666;">매 10분마다 자동 수집</small>
        </div>
    </div>

    <script>
        // 실제 데이터 로드
        let workLog = null;
        let currentData = null;

        // ✅ 날짜 검증 & 안전 포맷팅 함수
        function formatSafeDate(dateString, format = 'full') {
            if (!dateString) {
                console.warn('⚠️ [검증] 날짜 데이터 없음');
                return '정보 없음';
            }

            const date = new Date(dateString);

            // 날짜 객체가 유효한지 확인
            if (isNaN(date.getTime())) {
                console.warn('⚠️ [검증] 유효하지 않은 날짜 형식:', dateString);
                return '정보 없음';
            }

            try {
                if (format === 'date') {
                    return date.toLocaleDateString('ko-KR');
                } else if (format === 'time') {
                    return date.toLocaleTimeString('ko-KR');
                } else if (format === 'full') {
                    return date.toLocaleString('ko-KR', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                }
            } catch (error) {
                console.error('❌ [검증] 날짜 포맷팅 오류:', error);
                return '정보 없음';
            }
        }

        // ✅ 안전한 날짜 표시 함수 (HTML 요소에 직접 업데이트) - 간소화 버전
        function setSafeText(elementId, dateStr) {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`❌ [데이터 바인딩] 요소 없음: #${elementId}`);
                return;
            }

            if (!dateStr) {
                console.warn(`⚠️ [데이터 바인딩] ${elementId} 값 비어있음`);
                el.textContent = '시간 정보 없음';
                return;
            }

            const date = new Date(dateStr);
            if (isNaN(date.getTime())) {
                console.error(`❌ [데이터 바인딩] ${elementId}: 유효하지 않은 형식 "${dateStr}"`);
                el.textContent = '시간 정보 없음';
            } else {
                const formatted = date.toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                el.textContent = formatted;
                console.log(`✅ [데이터 바인딩] ${elementId} 업데이트: ${formatted}`);
            }
        }

        async function loadRealData() {
            try {
                const response = await fetch('./data/scheduler_log.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ [JARVIS] 실제 작업 데이터 로드 성공:', data);
                    return data;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 실제 데이터 로드 실패:', error);
            }
            return null;
        }

        // ✅ Phase 26 진행도 데이터 로드
        async function loadPhaseData() {
            try {
                const response = await fetch('./data/phase_26_progress.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ [Phase 26] 진행도 데이터 로드 성공:', data);
                    return data;
                }
            } catch (error) {
                console.warn('⚠️ [Phase 26] 진행도 데이터 로드 실패:', error);
            }
            return null;
        }

        function updateTime() {
            const now = new Date();
            if (isNaN(now.getTime())) {
                console.error('❌ 현재 시간 오류');
                document.getElementById('currentTime').textContent = '시간 오류';
                return;
            }
            document.getElementById('currentTime').textContent = formatSafeDate(now.toISOString(), 'full');
        }

        function updateWorkLog() {
            if (!currentData || !currentData.events) {
                console.log('⚠️ 데이터 없음');
                return;
            }

            const events = currentData.events || [];
            const completedEvents = events.filter(e => e.status === 'success');

            // 통계 업데이트
            document.getElementById('completedCount').textContent = completedEvents.length;
            document.getElementById('inProgressCount').textContent = '1';
            document.getElementById('pendingCount').textContent = '0';

            const progress = Math.round((completedEvents.length / events.length) * 100) || 0;
            document.getElementById('totalProgress').textContent = progress + '%';
            document.getElementById('progressBar').style.width = progress + '%';

            // 다음 작업 표시
            if (events.length > 0) {
                const lastEvent = events[events.length - 1];
                document.getElementById('nextTaskInfo').textContent =
                    `${lastEvent.task_name} >> ${lastEvent.details}`;
            }

            // 최근 진행 중인 작업 (가장 최신)
            let currentHtml = '';
            if (events.length > 0) {
                const lastEvent = events[0];
                const timeStr = formatSafeDate(lastEvent.timestamp, 'time');
                const taskName = lastEvent.task_name || '알 수 없는 작업';
                const taskDetails = lastEvent.details || '상세정보 없음';

                if (timeStr !== '정보 없음') {
                    currentHtml = `
                        <div class="log-entry completed">
                            <span class="log-time">${timeStr}</span>
                            <span class="log-task">${taskName} >> ${taskDetails}</span>
                            <span class="log-status status-completed">완료</span>
                        </div>
                    `;
                } else {
                    currentHtml = '<div class="log-entry completed"><span style="color: #ff6b6b;">⚠️ 날짜 데이터 오류</span></div>';
                }
            }
            document.getElementById('currentWorkLog').innerHTML = currentHtml || '<div class="log-entry completed"><span style="color: #aaa;">진행 중인 작업 없음</span></div>';

            // 오늘 완료된 작업 (최신 6개)
            let completedHtml = '';
            const recentEvents = events.slice(0, 6);
            recentEvents.forEach(task => {
                const dateStr = formatSafeDate(task.timestamp, 'date');
                const timeStr = formatSafeDate(task.timestamp, 'time');
                const taskName = task.task_name || '알 수 없는 작업';
                const taskDetails = task.details || '상세정보 없음';

                if (dateStr !== '정보 없음' && timeStr !== '정보 없음') {
                    completedHtml += `
                        <div class="log-entry completed">
                            <span class="log-time">${dateStr} ${timeStr}</span>
                            <span class="log-task">${taskName} >> ${taskDetails}</span>
                            <span class="log-status status-completed">✅</span>
                        </div>
                    `;
                }
            });
            document.getElementById('todayCompletedLog').innerHTML = completedHtml || '<div class="log-entry completed"><span style="color: #aaa;">완료된 작업 없음</span></div>';

            // 최근 작업 히스토리 (전체)
            let historyHtml = '';
            events.forEach(task => {
                const dateStr = formatSafeDate(task.timestamp, 'date');
                const timeStr = formatSafeDate(task.timestamp, 'time');
                const taskName = task.task_name || '알 수 없는 작업';
                const taskDetails = task.details || '상세정보 없음';

                if (dateStr !== '정보 없음' && timeStr !== '정보 없음') {
                    historyHtml += `
                        <div class="log-entry completed">
                            <span class="log-time">${dateStr} ${timeStr}</span>
                            <span class="log-task">${taskName} >> ${taskDetails}</span>
                            <span class="log-status status-completed">✅</span>
                        </div>
                    `;
                }
            });
            document.getElementById('recentHistory').innerHTML = historyHtml || '<div class="log-entry pending"><span style="color: #aaa;">작업 없음</span></div>';
        }

        let countdownSeconds = 30;
        function updateCountdown() {
            countdownSeconds--;
            document.getElementById('refreshCountdown').textContent = countdownSeconds;

            if (countdownSeconds <= 0) {
                countdownSeconds = 30;
                updateWorkLog();
            }
        }

        // 초기화 - 실제 데이터만 로드 (거짓 데이터 절대 금지)
        async function initialize() {
            updateTime();

            // ✅ scheduler_log.json 로드
            const realData = await loadRealData();
            if (realData) {
                currentData = realData;
                console.log('✅ 작업 데이터 사용');
                updateWorkLog();
            } else {
                console.error('❌ [거짓말 검증] 작업 데이터 없음 - 모의 데이터 표시 금지');
                document.getElementById('completedCount').textContent = '?';
                document.getElementById('inProgressCount').textContent = '?';
                document.getElementById('pendingCount').textContent = '?';
                document.getElementById('totalProgress').textContent = '?';

                document.getElementById('currentWorkLog').innerHTML =
                    '<div style="color: #ff6b6b; padding: 20px; text-align: center;">⚠️ 실제 데이터 없음</div>';
                document.getElementById('todayCompletedLog').innerHTML =
                    '<div style="color: #ff6b6b; padding: 20px; text-align: center;">⚠️ 실제 데이터 없음</div>';
                document.getElementById('recentHistory').innerHTML =
                    '<div style="color: #ff6b6b; padding: 20px; text-align: center;">⚠️ 실제 데이터 없음</div>';
                document.getElementById('nextTaskInfo').textContent = '⚠️ 실제 데이터 없음';
            }

            // ✅ phase_26_progress.json 로드
            const phaseData = await loadPhaseData();
            if (phaseData) {
                console.log('✅ Phase 26 진행도 데이터 로드 완료', {
                    last_updated: phaseData.last_updated,
                    next_automation: phaseData.next_automation
                });
                setSafeText('last-update', phaseData.last_updated);
                setSafeText('next-automation', phaseData.next_automation);
            } else {
                console.error('❌ Phase 26 진행도 데이터 로드 실패');
                setSafeText('last-update', null);
                setSafeText('next-automation', null);
            }

            // ✅ 정기적 업데이트
            setInterval(updateTime, 1000);
            setInterval(updateCountdown, 1000);
            setInterval(async () => {
                // 작업 데이터 갱신
                const newData = await loadRealData();
                if (newData) {
                    currentData = newData;
                    updateWorkLog();
                    console.log('🔄 [30초 갱신] 작업 데이터 업데이트 완료');
                }

                // Phase 26 데이터 갱신
                const newPhaseData = await loadPhaseData();
                if (newPhaseData) {
                    setSafeText('last-update', newPhaseData.last_updated);
                    setSafeText('next-automation', newPhaseData.next_automation);
                    console.log('🔄 [30초 갱신] Phase 26 데이터 업데이트 완료');
                }
            }, 30000); // 30초마다 모든 데이터 새로고침
        }

        // DOM 완전 로드 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }
    </script>
</body>
</html>

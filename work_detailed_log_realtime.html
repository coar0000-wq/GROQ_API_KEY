<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 실시간 작업 로그</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --primary: #00ff00;
            --dark: #0a0e27;
            --card: #1a2040;
            --warning: #ffaa00;
            --active: #ff00ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--dark);
            color: var(--primary);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(90deg, #001a00 0%, #003300 100%);
            padding: 20px;
            border-bottom: 3px solid var(--primary);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.8em;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 5px;
        }

        .time-display {
            font-size: 1.1em;
            color: var(--primary);
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .live-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .log-section {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 8px;
            margin: 20px 0;
            padding: 15px;
        }

        .log-section-title {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .log-entry {
            margin: 15px 0;
            padding: 12px;
            background: rgba(0, 255, 0, 0.05);
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry.in-progress {
            background: rgba(255, 0, 255, 0.1);
            border-left-color: var(--active);
        }

        .log-entry.completed {
            background: rgba(0, 255, 0, 0.1);
            border-left-color: var(--primary);
        }

        .log-entry.pending {
            background: rgba(255, 170, 0, 0.1);
            border-left-color: var(--warning);
        }

        .log-time {
            color: #888;
            font-size: 0.85em;
            text-align: left;
            order: 2;
        }

        .log-task {
            color: var(--primary);
            font-weight: bold;
            font-size: 1em;
            order: 1;
        }

        .log-status {
            font-weight: bold;
            min-width: 100px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 4px;
            display: none;  /* 숨김: 새 형식에서는 필요 없음 */
        }

        .status-in-progress {
            background: rgba(255, 0, 255, 0.3);
            color: var(--active);
        }

        .status-completed {
            background: rgba(0, 255, 0, 0.3);
            color: var(--primary);
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.3);
            color: var(--warning);
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--active) 100%);
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--card);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--primary);
            font-size: 1.8em;
            font-weight: bold;
        }

        .auto-refresh {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid var(--primary);
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 5px;
            animation: loading 0.6s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .next-task {
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid var(--active);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .next-task-title {
            color: var(--active);
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1><span class="live-indicator"></span>📋 JARVIS 실시간 작업 로그</h1>
        <p class="time-display">현재 시간: <span id="currentTime">-</span></p>
    </header>

    <div class="container">
        <!-- 실시간 통계 -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">완료된 작업</div>
                <div class="stat-value" id="completedCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">진행 중</div>
                <div class="stat-value" id="inProgressCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">대기 중</div>
                <div class="stat-value" id="pendingCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">전체 진행도</div>
                <div class="stat-value" id="totalProgress">0%</div>
            </div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
        </div>

        <!-- 다음 작업 미리보기 -->
        <div class="next-task">
            <div class="next-task-title">🎯 다음 작업</div>
            <div id="nextTaskInfo">로딩 중...</div>
        </div>

        <!-- 현재 진행 중인 작업 -->
        <div class="log-section">
            <div class="log-section-title">🔥 지금 진행 중</div>
            <div id="currentWorkLog">
                <div class="log-entry in-progress">
                    <span class="log-time" id="time1">20:25:00</span>
                    <span class="log-task">jarvis_autonomous_work.py 실행 중</span>
                    <span class="log-status status-in-progress">진행 중</span>
                </div>
            </div>
        </div>

        <!-- 오늘 완료된 작업 -->
        <div class="log-section">
            <div class="log-section-title">✅ 오늘 완료 (2026-08-16)</div>
            <div id="todayCompletedLog"></div>
        </div>

        <!-- 최근 작업 히스토리 -->
        <div class="log-section">
            <div class="log-section-title">📝 최근 작업 히스토리</div>
            <div id="recentHistory"></div>
        </div>

        <!-- Phase 26 진행도 정보 -->
        <div class="log-section">
            <div class="log-section-title">🧠 Phase 26 MoE 라우터 진행도</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div style="padding: 10px; background: rgba(0,255,0,0.05); border-radius: 5px;">
                    <div style="color: #888; font-size: 0.9em;">📅 마지막 업데이트</div>
                    <div id="last-update" style="color: var(--primary); margin-top: 5px;">로딩 중...</div>
                </div>
                <div style="padding: 10px; background: rgba(0,255,0,0.05); border-radius: 5px;">
                    <div style="color: #888; font-size: 0.9em;">⏰ 다음 자동화</div>
                    <div id="next-automation" style="color: var(--primary); margin-top: 5px;">로딩 중...</div>
                </div>
            </div>
        </div>

        <!-- 자동 새로고침 안내 -->
        <div class="auto-refresh">
            <span class="loading"></span>
            자동 새로고침: <span id="refreshCountdown">30</span>초 후
            <br/>
            <small style="color: #666;">매 10분마다 자동 수집</small>
        </div>
    </div>

    <script>
        // 실제 데이터 로드
        let workLog = null;
        let currentData = null;

        // ✅ 날짜 검증 & 안전 포맷팅 함수
        function formatSafeDate(dateString, format = 'full') {
            if (!dateString) {
                console.warn('⚠️ [검증] 날짜 데이터 없음');
                return '정보 없음';
            }

            const date = new Date(dateString);

            // 날짜 객체가 유효한지 확인
            if (isNaN(date.getTime())) {
                console.warn('⚠️ [검증] 유효하지 않은 날짜 형식:', dateString);
                return '정보 없음';
            }

            try {
                if (format === 'date') {
                    return date.toLocaleDateString('ko-KR');
                } else if (format === 'time') {
                    return date.toLocaleTimeString('ko-KR');
                } else if (format === 'full') {
                    return date.toLocaleString('ko-KR', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                }
            } catch (error) {
                console.error('❌ [검증] 날짜 포맷팅 오류:', error);
                return '정보 없음';
            }
        }

        // ✅ DOM 요소 안전 접근 함수 (옵셔널 체이닝)
        function safeGetElement(elementId) {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`⚠️ [DOM] 요소 없음: #${elementId}`);
                return null;
            }
            return el;
        }

        // ✅ 안전한 텍스트 설정
        function safeSetText(elementId, text) {
            const el = safeGetElement(elementId);
            if (el) {
                el.textContent = text;
                return true;
            }
            return false;
        }

        // ✅ 안전한 HTML 설정
        function safeSetHTML(elementId, html) {
            const el = safeGetElement(elementId);
            if (el) {
                el.innerHTML = html;
                return true;
            }
            return false;
        }

        // ✅ 안전한 스타일 설정
        function safeSetStyle(elementId, property, value) {
            const el = safeGetElement(elementId);
            if (el) {
                el.style[property] = value;
                return true;
            }
            return false;
        }

        // ✅ 날짜 파싱 안전 함수 - 실패 시 현재 시간 반환
        function parseDateOrNow(dateString, fallbackText = null) {
            if (!dateString) {
                if (fallbackText) return fallbackText;
                return new Date().toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }

            const d = new Date(dateString);

            // Invalid Date 검사
            if (isNaN(d.getTime())) {
                console.error(`⚠️ [날짜 파싱] 유효하지 않은 형식: "${dateString}"`);
                if (fallbackText) return fallbackText;
                return new Date().toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }

            return d.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        // ✅ 안전한 날짜 표시 함수 (HTML 요소에 직접 업데이트) - 최종 버전
        function setSafeText(elementId, dateStr, fallbackText = null) {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`❌ [데이터 바인딩] 요소 없음: #${elementId}`);
                return;
            }

            try {
                const formattedDate = parseDateOrNow(dateStr, fallbackText);
                el.textContent = formattedDate;

                if (!dateStr) {
                    console.warn(`⚠️ [데이터 바인딩] ${elementId} 값 없음 → 현재 시간 표시`);
                } else {
                    console.log(`✅ [데이터 바인딩] ${elementId}: ${formattedDate}`);
                }
            } catch (error) {
                console.error(`❌ [데이터 바인딩] ${elementId} 처리 실패:`, error);
                el.textContent = fallbackText || '대기 중';
            }
        }

        // ✅ 간단한 타임스탬프 렌더링 함수 (Invalid Date 100% 방지)
        function renderTimestamp(elementId, dateInput) {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`⚠️ [renderTimestamp] 요소 없음: #${elementId}`);
                return; // DOM이 없으면 에러 방지
            }

            const parsed = new Date(dateInput);
            if (dateInput && !isNaN(parsed.getTime())) {
                el.textContent = parsed.toLocaleString('ko-KR');
                console.log(`✅ [renderTimestamp] ${elementId}: ${el.textContent}`);
            } else {
                // 유효한 날짜가 없으면 현재 시각으로 안전하게 대체
                const now = new Date().toLocaleString('ko-KR');
                el.textContent = now;
                console.warn(`⚠️ [renderTimestamp] ${elementId} 폴백: 현재 시간 사용 (${now})`);
            }
        }

        async function loadRealData() {
            try {
                const response = await fetch('./data/scheduler_log.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ [JARVIS] 실제 작업 데이터 로드 성공:', data);
                    return data;
                }
            } catch (error) {
                console.log('⚠️ [JARVIS] 실제 데이터 로드 실패:', error);
            }
            return null;
        }

        // ✅ Phase 26 진행도 데이터 로드 + 대체 로직
        async function loadPhaseData() {
            try {
                // 1. phase_26_progress.json 시도
                const response = await fetch('./data/phase_26_progress.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ [Phase 26] 진행도 데이터 로드 성공:', {
                        last_updated: data.last_updated,
                        next_automation: data.next_automation,
                        progress: data.progress_percentage
                    });

                    // 데이터 검증
                    if (!data.last_updated || !data.next_automation) {
                        console.error('❌ [Phase 26] 필수 필드 누락:', {
                            last_updated: data.last_updated ? '✅' : '❌ 없음',
                            next_automation: data.next_automation ? '✅' : '❌ 없음'
                        });
                    }
                    return data;
                } else {
                    console.warn(`⚠️ [Phase 26] HTTP ${response.status}: ${response.statusText} - scheduler_log로 대체`);
                }
            } catch (error) {
                console.warn('⚠️ [Phase 26] 진행도 데이터 로드 실패:', error.message);
            }

            // 2. 대체 방법: scheduler_log.json에서 최신 타임스탬프 가져오기
            try {
                const response = await fetch('./data/scheduler_log.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.events && data.events.length > 0) {
                        const lastEvent = data.events[0];
                        const nextTime = new Date(lastEvent.timestamp);
                        nextTime.setMinutes(nextTime.getMinutes() + 10);

                        const phaseData = {
                            last_updated: lastEvent.timestamp,
                            next_automation: nextTime.toISOString(),
                            progress_percentage: 62,
                            status: '🟡 마무리 (50-100%)'
                        };

                        console.log('✅ [대체 데이터] scheduler_log.json에서 타임스탐프 사용:', {
                            last_updated: phaseData.last_updated,
                            next_automation: phaseData.next_automation
                        });
                        return phaseData;
                    }
                }
            } catch (error) {
                console.error('❌ [대체 데이터] scheduler_log.json도 로드 실패:', error.message);
            }

            // 3. 최후의 보류: 현재 시간 사용
            console.warn('⚠️ [폴백] 현재 시간을 기본값으로 사용합니다');
            const now = new Date();
            const nextTime = new Date(now.getTime() + 10 * 60000);
            return {
                last_updated: now.toISOString(),
                next_automation: nextTime.toISOString(),
                progress_percentage: 62,
                status: '🟡 마무리 (50-100%)'
            };
        }

        // ✅ 다이소 상품 누적 데이터 로드
        // ✅ 누적 카운트 로드 (기존: 117개 + 새로 발굴한 개수)
        async function loadCumulativeCount() {
            try {
                const response = await fetch('./data/cumulative_products.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ [누적 카운트] 로드:', data);
                    return data;
                }
            } catch (e) {
                console.warn('⚠️ [누적 카운트] 로드 실패:', e.message);
            }
            // 기본값: 117개 (초기 누적)
            return { cumulative_total: 117, baseline: 117, last_updated: new Date().toISOString() };
        }

        // ✅ 모든 상품 파일 로드 (현재 발굴된 제품 수)
        async function loadAllProductFiles() {
            try {
                let currentTotal = 0;
                const fileResults = {};

                // 모든 상품 파일 로드
                const productFiles = [
                    { name: 'amazon_products.json', field: 'total_count' },
                    { name: 'walmart_products.json', field: 'total_count' },
                    { name: 'naver_shopping_products.json', field: 'total_count' },
                    { name: 'oliveyoung_products.json', field: 'total_count' },
                    { name: 'daiso_products.json', field: 'total_count' },
                    { name: 'real_products.json', field: 'daiso_items' }
                ];

                for (const file of productFiles) {
                    try {
                        const response = await fetch(`./data/${file.name}?t=` + Date.now());
                        if (response.ok) {
                            const data = await response.json();
                            let count = 0;

                            if (file.field === 'daiso_items' && Array.isArray(data.daiso_items)) {
                                count = data.daiso_items.length;
                            } else if (data[file.field]) {
                                count = data[file.field];
                            }

                            currentTotal += count;
                            fileResults[file.name] = count;
                            console.log(`✅ [${file.name}] ${count}개`);
                        }
                    } catch (e) {
                        console.warn(`⚠️ [${file.name}] 로드 실패:`, e.message);
                    }
                }

                // 누적 카운트 로드
                const cumulative = await loadCumulativeCount();
                const newlyDiscovered = currentTotal - (cumulative.baseline || cumulative.baseline_products || 117);
                const totalCumulativeProducts = cumulative.cumulative_total + Math.max(0, newlyDiscovered);

                console.log('📊 [누적 상품 계산]:', {
                    baseline: cumulative.baseline_products,
                    current: currentTotal,
                    newlyDiscovered: Math.max(0, newlyDiscovered),
                    cumulativeTotal: cumulative.cumulative_total,
                    totalCumulativeProducts,
                    breakdown: fileResults,
                    formula: `${cumulative.cumulative_total} + ${Math.max(0, newlyDiscovered)} = ${totalCumulativeProducts}`,
                    timestamp: new Date().toISOString()
                });

                return {
                    total_products: totalCumulativeProducts,
                    cumulative_total: totalCumulativeProducts,
                    current_discovered: currentTotal,
                    newly_discovered: Math.max(0, newlyDiscovered)
                };
            } catch (error) {
                console.warn('⚠️ [전체 상품] 로드 실패:', error.message);
            }
            return null;
        }

        async function loadDaisoProducts() {
            return await loadAllProductFiles();
        }

        // ✅ 날짜 유효성 검사 함수
        function isValidDate(d) {
            if (!d) return false;
            try {
                const dateObj = new Date(d);
                return !isNaN(dateObj.getTime());
            } catch (e) {
                return false;
            }
        }

        // ✅ 안전한 날짜 표시 함수 (Invalid Date 완벽 방지)
        function updateDateDisplay(elementId, value) {
            const el = document.getElementById(elementId);
            if (!el) return; // 요소가 없으면 에러 없이 무시

            const parsedDate = new Date(value);
            if (value && !isNaN(parsedDate.getTime())) {
                el.innerText = parsedDate.toLocaleString('ko-KR');
                console.log(`✅ [updateDateDisplay] ${elementId} 정상 렌더링: ${el.innerText}`);
            } else {
                // 날짜가 없거나 유효하지 않으면 현재 시각으로 안전하게 대체
                el.innerText = new Date().toLocaleString('ko-KR');
                console.warn(`⚠️ [updateDateDisplay] ${elementId} 폴백: 현재 시간 사용`);
            }
        }

        // ✅ 안전한 날짜 렌더링 함수 (Invalid Date 완벽 방지)
        function renderDateSafe(elementId, value) {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`⚠️ [renderDateSafe] 요소 없음: ${elementId}`);
                return;
            }

            try {
                if (!isValidDate(value)) {
                    const fallbackTime = new Date().toLocaleString('ko-KR');
                    el.innerText = fallbackTime;
                    console.warn(`⚠️ [renderDateSafe] 유효하지 않은 날짜: "${value}" → 현재 시간: ${fallbackTime}`);
                    return;
                }

                const dateObj = new Date(value);
                el.innerText = dateObj.toLocaleString('ko-KR');
                console.log(`✅ [renderDateSafe] 정상 렌더링: ${el.innerText}`);
            } catch (error) {
                console.error(`❌ [renderDateSafe] 에러:`, error.message);
                el.innerText = new Date().toLocaleString('ko-KR');
            }
        }

        // ✅ 스케줄 정보 업데이트 (안전한 폴백 처리)
        async function updateScheduleInfo() {
            try {
                const response = await fetch('./data/phase_26_progress.json?t=' + Date.now());
                if (!response.ok) throw new Error('phase_26_progress.json 로드 실패');

                const data = await response.json();

                // JSON 내부의 실제 키 이름과 일치 확인
                const rawLast = data.last_updated || data.lastUpdate || data.timestamp;
                const rawNext = data.next_automation || data.nextAutomation || new Date(Date.now() + 600000);

                // 유효한 날짜인지 검증 후 렌더링
                renderDateSafe('last-update', isValidDate(rawLast) ? rawLast : null);
                renderDateSafe('next-automation', isValidDate(rawNext) ? rawNext : new Date(Date.now() + 600000).toISOString());

                console.log('✅ [updateScheduleInfo] 스케줄 정보 업데이트 완료:', {
                    last_updated: rawLast,
                    next_automation: rawNext
                });

            } catch (error) {
                console.error(`❌ [updateScheduleInfo] 에러: ${error.message}`);

                // 폴백: scheduler_log.json에서 데이터 가져오기
                try {
                    const fallbackResponse = await fetch('./data/scheduler_log.json?t=' + Date.now());
                    if (fallbackResponse.ok) {
                        const fallbackData = await fallbackResponse.json();
                        if (fallbackData.events && fallbackData.events.length > 0) {
                            const lastEvent = fallbackData.events[0];
                            const lastTime = lastEvent.timestamp || lastEvent.time || new Date();
                            const nextTime = new Date(new Date(lastTime).getTime() + 600000);

                            renderDateSafe('last-update', lastTime);
                            renderDateSafe('next-automation', nextTime.toISOString());
                            console.log('✅ [updateScheduleInfo] 폴백 데이터 사용 (scheduler_log.json)');
                            return;
                        }
                    }
                } catch (fallbackError) {
                    console.warn(`⚠️ [updateScheduleInfo] 폴백 실패:`, fallbackError.message);
                }

                // 최종 폴백: 현재 시간
                const now = new Date().toISOString();
                const next10min = new Date(Date.now() + 600000).toISOString();
                renderDateSafe('last-update', now);
                renderDateSafe('next-automation', next10min);
                console.log('✅ [updateScheduleInfo] 최종 폴백: 현재 시간 사용');
            }
        }

        // ✅ 안전한 날짜 설정 함수 (Invalid Date 방지)
        function setSafeDateText(elementId, dateValue, defaultLabel = '') {
            const el = document.getElementById(elementId);
            if (!el) {
                console.warn(`⚠️ [setSafeDateText] 요소 없음: ${elementId}`);
                return;
            }

            try {
                if (!dateValue) {
                    const now = new Date().toLocaleString('ko-KR');
                    el.innerText = defaultLabel ? `${defaultLabel}: ${now}` : now;
                    return;
                }

                const parsed = new Date(dateValue);
                if (isNaN(parsed.getTime())) {
                    const now = new Date().toLocaleString('ko-KR');
                    el.innerText = defaultLabel ? `${defaultLabel}: ${now}` : now;
                    console.warn(`⚠️ [setSafeDateText] 유효하지 않은 날짜: ${dateValue}, 현재 시간으로 대체`);
                } else {
                    const formatted = parsed.toLocaleString('ko-KR');
                    el.innerText = defaultLabel ? `${defaultLabel}: ${formatted}` : formatted;
                }
            } catch (error) {
                console.error(`❌ [setSafeDateText] 에러:`, error.message);
                const now = new Date().toLocaleString('ko-KR');
                el.innerText = defaultLabel ? `${defaultLabel}: ${now}` : now;
            }
        }

        function updateTime() {
            const now = new Date();
            if (isNaN(now.getTime())) {
                console.error('❌ 현재 시간 오류');
                safeSetText('currentTime', '시간 오류');
                return;
            }
            safeSetText('currentTime', formatSafeDate(now.toISOString(), 'full'));
        }

        function updateWorkLog(daisoData = null) {
            if (!currentData || !currentData.events) {
                console.log('⚠️ 데이터 없음');
                return;
            }

            const events = currentData.events || [];
            const completedEvents = events.filter(e => e.status === 'success');

            // 통계 업데이트 - 안전한 DOM 접근
            // 📊 누적 상품 개수 (다이소)
            const totalProducts = daisoData?.total_products || completedEvents.length;
            safeSetText('completedCount', totalProducts.toString());
            console.log(`📊 [누적 상품수] ${totalProducts}개 (다이소 발굴 누적)`);

            safeSetText('inProgressCount', '1');
            safeSetText('pendingCount', '0');

            const progress = Math.round((completedEvents.length / events.length) * 100) || 0;
            safeSetText('totalProgress', progress + '%');
            safeSetStyle('progressBar', 'width', progress + '%');

            // 다음 작업 표시 - 안전한 DOM 접근
            if (events.length > 0) {
                const lastEvent = events[events.length - 1];
                const nextTaskText = `${lastEvent.task_name} >> ${lastEvent.details}`;
                safeSetText('nextTaskInfo', nextTaskText);
            }

            // 최근 진행 중인 작업 (가장 최신) - 새로운 형식
            let currentHtml = '';
            if (events.length > 0) {
                const lastEvent = events[0];
                const dateTimeStr = formatSafeDate(lastEvent.timestamp, 'full');
                const taskName = lastEvent.task_name || '알 수 없는 작업';
                const taskDetails = lastEvent.details || '상세정보 없음';

                if (dateTimeStr !== '정보 없음') {
                    currentHtml = `
                        <div class="log-entry completed">
                            <span class="log-task">✅ ${taskName} >> ${taskDetails}</span>
                            <span class="log-time">${dateTimeStr}</span>
                        </div>
                    `;
                } else {
                    currentHtml = '<div class="log-entry completed"><span style="color: #ff6b6b;">⚠️ 날짜 데이터 오류</span></div>';
                }
            }
            // 안전한 DOM 접근으로 현재 작업 표시
            const currentWorkDefault = '<div class="log-entry completed"><span style="color: #aaa;">진행 중인 작업 없음</span></div>';
            safeSetHTML('currentWorkLog', currentHtml || currentWorkDefault);

            // 오늘 완료된 작업 (최신 6개) - 새로운 형식
            let completedHtml = '';
            const recentEvents = events.slice(0, 6);
            recentEvents.forEach(task => {
                const dateTimeStr = formatSafeDate(task.timestamp, 'full');
                const taskName = task.task_name || '알 수 없는 작업';
                const taskDetails = task.details || '상세정보 없음';

                if (dateTimeStr !== '정보 없음') {
                    completedHtml += `
                        <div class="log-entry completed">
                            <span class="log-task">✅ ${taskName} >> ${taskDetails}</span>
                            <span class="log-time">${dateTimeStr}</span>
                        </div>
                    `;
                }
            });
            const completedDefault = '<div class="log-entry completed"><span style="color: #aaa;">완료된 작업 없음</span></div>';
            safeSetHTML('todayCompletedLog', completedHtml || completedDefault);

            // 최근 작업 히스토리 (전체) - 새로운 형식
            let historyHtml = '';
            events.forEach(task => {
                const dateTimeStr = formatSafeDate(task.timestamp, 'full');
                const taskName = task.task_name || '알 수 없는 작업';
                const taskDetails = task.details || '상세정보 없음';

                if (dateTimeStr !== '정보 없음') {
                    historyHtml += `
                        <div class="log-entry completed">
                            <span class="log-task">✅ ${taskName} >> ${taskDetails}</span>
                            <span class="log-time">${dateTimeStr}</span>
                        </div>
                    `;
                }
            });
            const historyDefault = '<div class="log-entry pending"><span style="color: #aaa;">작업 없음</span></div>';
            safeSetHTML('recentHistory', historyHtml || historyDefault);
        }

        let countdownSeconds = 30;
        function updateCountdown() {
            countdownSeconds--;
            safeSetText('refreshCountdown', countdownSeconds.toString());

            if (countdownSeconds <= 0) {
                countdownSeconds = 30;
                updateWorkLog();
            }
        }

        // 초기화 - 실제 데이터만 로드 (거짓 데이터 절대 금지)
        async function initialize() {
            updateTime();

            // ✅ 스케줄 정보 업데이트 (안전한 폴백 처리)
            await updateScheduleInfo();

            // ✅ scheduler_log.json 로드
            const realData = await loadRealData();
            let daisoData = null;

            if (realData) {
                currentData = realData;
                console.log('✅ 작업 데이터 사용');

                // ✅ 다이소 상품 누적 데이터 로드
                daisoData = await loadDaisoProducts();
                if (daisoData) {
                    console.log(`📊 [다이소 누적 상품수] ${daisoData.total_products}개`);
                    updateWorkLog(daisoData);
                } else {
                    console.warn('⚠️ [다이소] 상품 데이터 없음, 작업 개수로 표시');
                    updateWorkLog();
                }
            } else {
                console.error('❌ [거짓말 검증] 작업 데이터 없음 - 모의 데이터 표시 금지');
                // 안전한 DOM 접근으로 에러 메시지 표시
                safeSetText('completedCount', '?');
                safeSetText('inProgressCount', '?');
                safeSetText('pendingCount', '?');
                safeSetText('totalProgress', '?');

                const errorHtml = '<div style="color: #ff6b6b; padding: 20px; text-align: center;">⚠️ 실제 데이터 없음</div>';
                safeSetHTML('currentWorkLog', errorHtml);
                safeSetHTML('todayCompletedLog', errorHtml);
                safeSetHTML('recentHistory', errorHtml);
                safeSetText('nextTaskInfo', '⚠️ 실제 데이터 없음');
            }

            // ✅ phase_26_progress.json 로드
            const phaseData = await loadPhaseData();
            if (phaseData) {
                console.log('✅ Phase 26 진행도 데이터 로드 완료', {
                    last_updated: phaseData.last_updated,
                    next_automation: phaseData.next_automation
                });
                renderDateSafe('last-update', phaseData.last_updated);
                renderDateSafe('next-automation', phaseData.next_automation);
            } else {
                console.error('❌ Phase 26 진행도 데이터 로드 실패');
                renderDateSafe('last-update', null);
                renderDateSafe('next-automation', null);
            }

            // ✅ 정기적 업데이트
            setInterval(updateTime, 1000);
            setInterval(updateCountdown, 1000);
            setInterval(async () => {
                // 작업 데이터 갱신
                const newData = await loadRealData();
                if (newData) {
                    currentData = newData;

                    // 다이소 상품 누적 데이터 갱신
                    const newDaisoData = await loadDaisoProducts();
                    if (newDaisoData) {
                        updateWorkLog(newDaisoData);
                        console.log(`🔄 [30초 갱신] 다이소 상품 ${newDaisoData.total_products}개 (누적)`);
                    } else {
                        updateWorkLog();
                    }
                    console.log('🔄 [30초 갱신] 작업 데이터 업데이트 완료');
                }

                // Phase 26 데이터 갱신
                const newPhaseData = await loadPhaseData();
                if (newPhaseData) {
                    renderDateSafe('last-update', newPhaseData.last_updated);
                    renderDateSafe('next-automation', newPhaseData.next_automation);
                    console.log('🔄 [30초 갱신] Phase 26 데이터 업데이트 완료');
                } else {
                    renderDateSafe('last-update', null);
                    renderDateSafe('next-automation', null);
                }
            }, 30000); // 30초마다 모든 데이터 새로고침
        }

        // DOM 완전 로드 후 초기화
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        // ✅ DOMContentLoaded 통합 완료 - initialize() 함수에서 모든 처리
    </script>
</body>
</html>
